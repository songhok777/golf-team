<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>골프 조편성 프로그램 (0명 설정 가능)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 20px;
        }
        .info {
            font-size: 0.9em;
            color: #666;
            background: #eef2f3;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        /* 실시간 인원 표시 카운터 스타일 */
        .live-counter {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.1em;
            font-weight: bold;
            color: #2e7d32;
        }
        .live-counter span {
            font-size: 1.3em;
            color: #c62828;
            margin: 0 3px;
        }

        /* 조별 인원 설정 섹션 */
        .setting-section {
            background: #f1f8e9;
            border: 1px solid #c5e1a5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .setting-title {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .config-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .config-box {
            background: #fff;
            border: 1px solid #aeaeae;
            padding: 6px 10px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.95em;
        }
        .config-box select {
            padding: 2px 5px;
            font-size: 0.95em;
        }
        .btn-small {
            padding: 4px 8px;
            font-size: 0.85em;
            background: #558b2f;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .member-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        @media (max-width: 480px) {
            .member-list { grid-template-columns: repeat(2, 1fr); }
        }
        .member-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            cursor: pointer;
            display: flex;
            align-items: center;
            user-select: none;
        }
        .member-item input {
            margin-right: 8px;
            width: 16px;
            height: 16px;
        }
        .member-item.checked {
            background: #e8f5e9;
            border-color: #81c784;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit { background-color: #2e7d32; color: white; }
        .btn-submit:hover { background-color: #1b5e20; }
        .btn-toggle { background-color: #78909c; color: white; }
        .btn-toggle:hover { background-color: #546e7a; }
        
        .result-section {
            margin-top: 25px;
            border-top: 2px dashed #ccc;
            padding-top: 20px;
        }
        .result-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #1b5e20;
            margin-bottom: 15px;
        }
        .team-box {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-left: 5px solid #2e7d32;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 1.05em;
        }
        .team-name {
            font-weight: bold;
            color: #2e7d32;
            margin-right: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⛳ 골프 자동 조편성 (0명 설정 가능)</h2>
    
    <div class="info">
        1. 오늘 <strong>참석하는 회원만 체크</strong>해 주세요.<br>
        2. 각 조의 인원을 선택해 주세요. <strong>불참 조는 '0명'으로 설정</strong>하면 제외됩니다.<br>
        <span style="color: #c62828;">⚠️ 실시간 참석 인원과 조별 인원 설정 총합이 일치해야 합니다.</span>
    </div>

    <div class="live-counter">
        현재 체크된 참석 인원: <span id="liveAttendeeCount">16</span>명
    </div>

    <div class="btn-group">
        <button type="button" class="btn-toggle" onclick="toggleAll()">전체 선택/해제</button>
    </div>

    <div class="member-list" id="memberList"></div>

    <div class="setting-section">
        <div class="setting-title">
            <span>🛠️ 조별 인원 설정 (현재 설정 총합: <span id="setupTotal">16</span>명)</span>
            <div>
                <button type="button" class="btn-small" onclick="addTeamConfig()">+ 조 추가</button>
                <button type="button" class="btn-small" style="background:#c62828;" onclick="removeTeamConfig()">- 조 삭제</button>
            </div>
        </div>
        <div class="config-row" id="configRow">
            </div>
    </div>

    <div class="btn-group">
        <button type="button" class="btn-submit" onclick="generateTeams()">랜덤 조편성 시작</button>
    </div>

    <div class="result-section" id="resultSection" style="display: none;">
        <div class="result-title">📢 조편성 결과 (<span id="totalCount">0</span>명 참석)</div>
        <div id="teamResults"></div>
    </div>
</div>

<script>
    // 16명 명단
    const members = [
        "장희연", "최정민", "정혜란", "최진식", 
        "남경훈", "명재옥", "오정애", "박진찬", 
        "김철", "김철진", "이종학", "서효숙", 
        "이선호", "장진하", "김기태", "김송호"
    ];

    // 화면 회원 렌더링
    const memberListDiv = document.getElementById('memberList');
    members.forEach((name, index) => {
        const item = document.createElement('div');
        item.className = 'member-item checked';
        item.innerHTML = `
            <input type="checkbox" id="mem_${index}" checked onchange="handleCheckboxChange()">
            <label for="mem_${index}" style="cursor:pointer; width:100%;">${name}</label>
        `;
        item.addEventListener('click', function(e) {
            if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL') {
                const chk = this.querySelector('input');
                chk.checked = !chk.checked;
                handleCheckboxChange();
            }
        });
        memberListDiv.appendChild(item);
    });

    // 체크박스 상태 변경 시 호출되는 통합 함수
    function handleCheckboxChange() {
        updateClasses();
        calculateLiveAttendees();
    }

    // 체크박스 배경 스타일 업데이트
    function updateClasses() {
        const checkboxes = document.querySelectorAll('.member-list input');
        checkboxes.forEach(chk => {
            if(chk.checked) chk.parentElement.classList.add('checked');
            else chk.parentElement.classList.remove('checked');
        });
    }

    // 실시간 참석자 수 계산 및 표시
    function calculateLiveAttendees() {
        const checkboxes = document.querySelectorAll('.member-list input');
        let checkedCount = 0;
        checkboxes.forEach(chk => {
            if(chk.checked) checkedCount++;
        });
        document.getElementById('liveAttendeeCount').innerText = checkedCount;
    }

    let allChecked = true;
    function toggleAll() {
        allChecked = !allChecked;
        const checkboxes = document.querySelectorAll('.member-list input');
        checkboxes.forEach(chk => {
            chk.checked = allChecked;
        });
        handleCheckboxChange();
    }

    // 조 설정 동적 관리
    let teamCount = 0;
    const configRow = document.getElementById('configRow');

    function addTeamConfig(initialValue = 4) {
        teamCount++;
        const div = document.createElement('div');
        div.className = 'config-box';
        div.id = `config_box_${teamCount}`;
        div.innerHTML = `
            <span>${teamCount}조:</span>
            <select class="team-size-select" onchange="calculateSetupTotal()">
                <option value="0" ${initialValue === 0 ? 'selected' : ''}>0명</option>
                <option value="2" ${initialValue === 2 ? 'selected' : ''}>2명</option>
                <option value="3" ${initialValue === 3 ? 'selected' : ''}>3명</option>
                <option value="4" ${initialValue === 4 ? 'selected' : ''}>4명</option>
            </select>
        `;
        configRow.appendChild(div);
        calculateSetupTotal();
    }

    function removeTeamConfig() {
        if (teamCount <= 1) return;
        const lastBox = document.getElementById(`config_box_${teamCount}`);
        configRow.removeChild(lastBox);
        teamCount--;
        calculateSetupTotal();
    }

    function calculateSetupTotal() {
        const selects = document.querySelectorAll('.team-size-select');
        let sum = 0;
        selects.forEach(sel => sum += parseInt(sel.value));
        document.getElementById('setupTotal').innerText = sum;
    }

    // 초기 화면 세팅 (4명씩 4개조 자동 세팅)
    addTeamConfig(4);
    addTeamConfig(4);
    addTeamConfig(4);
    addTeamConfig(4);
    calculateLiveAttendees();

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // 조편성 실행
    function generateTeams() {
        const attendees = [];
        members.forEach((name, index) => {
            if(document.getElementById(`mem_${index}`).checked) {
                attendees.push(name);
            }
        });

        const totalAttendees = attendees.length;
        if(totalAttendees === 0) {
            alert("참석자를 선택해 주세요.");
            return;
        }

        // 설정된 조별 인원 수집
        const selects = document.querySelectorAll('.team-size-select');
        let targetTotal = 0;
        let teamSizes = [];
        
        selects.forEach(sel => {
            const val = parseInt(sel.value);
            targetTotal += val;
            teamSizes.push(val);
        });

        // 검증: 참석자 수와 조 인원 설정값의 합이 맞는지 확인
        if (totalAttendees !== targetTotal) {
            alert(`인원이 맞지 않습니다!\n\n• 현재 체크된 참석자: ${totalAttendees}명\n• 설정된 조 인원 합계: ${targetTotal}명\n\n조 개수나 조별 인원(0~4명)을 조정하여 숫자를 맞춰주세요.`);
            return;
        }

        // 명단 섞기
        shuffle(attendees);

        // 조 나누기 및 출력
        document.getElementById('totalCount').innerText = totalAttendees;
        const resultDiv = document.getElementById('teamResults');
        resultDiv.innerHTML = '';

        let currentIdx = 0;
        let displayTeamNum = 1; // 실제 표시될 조 번호 (0명인 조는 건너뜀)

        teamSizes.forEach((size, index) => {
            if (size === 0) return; // 0명으로 설정된 조는 출력을 건너뜀

            const teamMembers = attendees.slice(currentIdx, currentIdx + size);
            currentIdx += size;

            const box = document.createElement('div');
            box.className = 'team-box';
            box.innerHTML = `<span class="team-name">${displayTeamNum}조 (${size}인):</span> ${teamMembers.join(', ')}`;
            resultDiv.appendChild(box);
            displayTeamNum++;
        });

        document.getElementById('resultSection').style.display = 'block';
    }
</script>

</body>
</html>
